name: Refresh data snapshot

on:
  schedule:
    # Every 6 hours, on the hour
    - cron: "0 */6 * * *"
  workflow_dispatch: {} # allow manual trigger from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run refresher
        run: node scripts/refresh.mjs

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/snapshot.json)" ]; then
            git add data/snapshot.json
            git commit -m "data: refresh snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "No snapshot changes."
          fi
